# Include inside EVERY proxied location. Never add a location without this file.
include /etc/nginx/private/prep-sheet-proxy-secret.conf;
proxy_pass http://127.0.0.1:3001;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host PUBLIC_HOST;
proxy_set_header X-Prep-Sheet-Client-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Real-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header CF-Connecting-IP "";
proxy_cache off;
proxy_next_upstream off;
# Stream raw bytes immediately, including chunked requests. Node's bounded body
# reader enforces the total 15s deadline; nginx timeouts only bound idle gaps.
proxy_request_buffering off;
proxy_buffering off;
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
# Includes a 15s DB statement budget and the 10s PDF worker deadline, plus margin.
proxy_read_timeout 45s;
