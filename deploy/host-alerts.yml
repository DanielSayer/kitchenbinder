# Load into the chosen host's Prometheus after installing node_exporter.
# Routing/receivers belong to the operator's Alertmanager configuration.
groups:
  - name: prep-sheet-host
    rules:
      - alert: PrepSheetHostMissing
        expr: up{job="prep-sheet-host"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Kitchenbinder host telemetry is unavailable
      - alert: PrepSheetDiskSpaceLow
        expr: node_filesystem_avail_bytes{job="prep-sheet-host",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Kitchenbinder host has less than 15 percent disk space free
      - alert: PrepSheetMemoryLow
        expr: node_memory_MemAvailable_bytes{job="prep-sheet-host"} / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kitchenbinder host has less than 10 percent memory available
      - alert: PrepSheetCpuSaturated
        expr: 1 - avg by(instance) (rate(node_cpu_seconds_total{job="prep-sheet-host",mode="idle"}[5m])) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Kitchenbinder host CPU exceeds 90 percent
      - alert: PrepSheetHostTelemetryAbsent
        expr: absent(up{job="prep-sheet-host"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Kitchenbinder host monitoring target is absent
