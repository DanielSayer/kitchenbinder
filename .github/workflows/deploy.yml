name: Deploy production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check publishing, access and server configuration without restarting or migrating
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      deploy: true
      dry_run: ${{ inputs.dry_run }}
