name: Deploy production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check publishing, access and server configuration without restarting or migrating
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://kitchenbinder.app
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      LIGHTSAIL_INSTANCE: ${{ vars.LIGHTSAIL_INSTANCE }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - name: Get short-lived deployment credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.DEPLOY_AWS_ROLE }}
          aws-region: ap-southeast-2
          role-session-name: kitchenbinder-${{ github.run_id }}
      - name: Prepare pinned SSH identity and runner address
        id: access
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ip=$(curl --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)
          python3 -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).version == 4' "$ip"
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"
      - name: Allow this runner through the SSH firewall
        run: >-
          aws lightsail open-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE"
          --port-info 'fromPort=22,toPort=22,protocol=tcp,cidrs=${{ steps.access.outputs.cidr }}'
          --no-cli-pager > /dev/null
      - name: Deploy the tested image
        env:
          RELEASE_IMAGE: ${{ needs.build.outputs.image }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mode=deploy
          if [[ "$DRY_RUN" == true ]]; then mode=check; fi
          digest="${RELEASE_IMAGE##*@}"
          printf '%s' "$GH_TOKEN" | ssh -i "$HOME/.ssh/deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 \
            "prepsheet-deploy@$DEPLOY_HOST" "$mode $digest $GITHUB_SHA $GITHUB_ACTOR"
          echo "Mode: $mode. Release: \`$GITHUB_SHA\`. Image: \`$RELEASE_IMAGE\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove this runner's SSH firewall rule
        if: always() && steps.access.outputs.cidr != ''
        run: >-
          aws lightsail close-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE"
          --port-info 'fromPort=22,toPort=22,protocol=tcp,cidrs=${{ steps.access.outputs.cidr }}'
          --no-cli-pager > /dev/null
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy"
