name: Release checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after checks pass, restricted to master
        type: boolean
        default: false
      dry_run:
        description: Check deployment access without restarting or migrating
        type: boolean
        default: true
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    outputs:
      image:
        description: Tested immutable release image
        value: ${{ jobs.release-checks.outputs.image }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-checks:
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      LIVE_AI_TEST: "0"
      DATABASE_URL: postgresql://postgres:build_only@127.0.0.1:5432/prep_sheet_build
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-production-123456789
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.7.0"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint without writes
        run: pnpm check
      - name: Check release scripts and failure recovery
        run: |
          bash -n deploy/release.sh deploy/ssh-entry.sh
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace python:3.12-slim python3 deploy/test_release.py
      - name: Build web production artifact
        run: pnpm --filter web build
      - name: Check root and every TypeScript package without cached results
        run: pnpm check-types
      - name: Test with disposable PostgreSQL and fresh production artifact
        run: pnpm test
      - name: Build portable Linux release
        run: >-
          docker build -t kitchenbinder-ci:local
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.title=Kitchenbinder"
          --label "org.opencontainers.image.description=Save, organise and share recipes, plan meals and build shopping lists."
          --label "org.opencontainers.image.url=https://kitchenbinder.app" .
      - name: Verify packaged migrations, HTTP/PDF, worker shutdown and Compose readiness
        env:
          PREP_SHEET_RELEASE_IMAGE: kitchenbinder-ci:local
        run: pnpm test packages/db/src/migrations.test.ts packages/api/src/recipes/production-server.test.ts packages/api/src/import-worker.production.test.ts packages/auth/src/proxy.production.test.ts packages/api/src/operations.compose.test.ts
      - name: Confirm checks did not modify tracked files
        run: git diff --exit-code
      - name: Publish the tested image
        id: publish
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_LEGACY_IMAGE: ${{ vars.PUBLISH_LEGACY_IMAGE != 'false' }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kitchenbinder"
          compatibility_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prep-sheet"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag kitchenbinder-ci:local "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          reference=$(docker image inspect "$image:$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$image@sha256:")
          [[ "$reference" == "$image@sha256:"* ]]
          # Installed host helpers still pull the previous package name. Publish
          # the same image there until all helpers have been updated.
          if [[ "$PUBLISH_LEGACY_IMAGE" == true ]]; then
            docker tag kitchenbinder-ci:local "$compatibility_image:$GITHUB_SHA"
            docker push "$compatibility_image:$GITHUB_SHA"
            compatibility_reference=$(docker image inspect "$compatibility_image:$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$compatibility_image@sha256:")
            [[ "${reference##*@}" == "${compatibility_reference##*@}" ]]
          fi
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          echo "Tested image: \`$reference\`" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: release-checks
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy)
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://kitchenbinder.app
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      LIGHTSAIL_INSTANCE: ${{ vars.LIGHTSAIL_INSTANCE }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - name: Skip a superseded release
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipped superseded commit $GITHUB_SHA; master is $current." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Get short-lived deployment credentials
        if: steps.head.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.DEPLOY_AWS_ROLE }}
          aws-region: ap-southeast-2
          role-session-name: kitchenbinder-${{ github.run_id }}
          retry-max-attempts: 3
      - name: Prepare pinned SSH identity and runner address
        if: steps.head.outputs.current == 'true'
        id: access
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ip=$(curl --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)
          python3 -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).version == 4' "$ip"
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"
      - name: Allow this runner through the SSH firewall
        if: steps.head.outputs.current == 'true'
        run: >-
          aws lightsail open-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE"
          --port-info 'fromPort=22,toPort=22,protocol=tcp,cidrs=${{ steps.access.outputs.cidr }}'
          --no-cli-pager > /dev/null
      - name: Deploy the tested image
        if: steps.head.outputs.current == 'true'
        env:
          RELEASE_IMAGE: ${{ needs.release-checks.outputs.image }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          mode=deploy
          if [[ "$DRY_RUN" == true ]]; then mode=check; fi
          digest="${RELEASE_IMAGE##*@}"
          printf '%s' "$GH_TOKEN" | ssh -i "$HOME/.ssh/deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 \
            "prepsheet-deploy@$DEPLOY_HOST" "$mode $digest $GITHUB_SHA $GITHUB_ACTOR"
          echo "Mode: $mode. Release: \`$GITHUB_SHA\`. Image: \`$RELEASE_IMAGE\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove this runner's SSH firewall rule
        if: always() && steps.access.outputs.cidr != ''
        run: >-
          aws lightsail close-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE"
          --port-info 'fromPort=22,toPort=22,protocol=tcp,cidrs=${{ steps.access.outputs.cidr }}'
          --no-cli-pager > /dev/null
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy"
